name: yvenist
description: "Yvenist: the all-in-one marketplace for events and parties."
# Pacote privado: nunca deve ser publicado no pub.dev.
publish_to: 'none'

# version: <nome>+<número do build>. No Android viram versionName/versionCode;
# no iOS, CFBundleShortVersionString/CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

# Gera os ícones do app: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    # Licença da fonte, exibida em "Licenças de código aberto".
    - assets/fonts/Inter-OFL.txt

  # Inter 4.1 (https://rsms.me/inter), licença SIL Open Font License 1.1.
  # Só os quatro pesos que o app usa.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
