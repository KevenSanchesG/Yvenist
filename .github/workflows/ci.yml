# Verificações automáticas do Yvenist: rodam a cada push, em qualquer branch
# (um pull request mostra o resultado do último commit da branch dele), e
# podem ser disparadas à mão na aba Actions. Cada job é independente; se um
# falhar, os outros continuam.
#
# O que cada job garante (e onde isso já foi conferido à mão):
#   app          formatação, análise estática e testes do Flutter; e a
#                integridade da Knowledge Base (docs/)
#   backend      lint, tipos e testes da API em SQLite e em PostgreSQL
#   integration  o app de verdade falando com a API de verdade, na máquina e
#                dentro do navegador
#   android      o APK de debug compila
#   docker       a imagem da API e o docker-compose sobem e respondem; a
#                receita de produção (deploy/) sobe com HTTPS e com as travas

name: CI

on:
  push:
  workflow_dispatch:

# Um push novo cancela a execução que ainda estiver rodando na mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.7"
  PYTHON_VERSION: "3.14"

jobs:
  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze

      # Os testes de integração ficam de fora aqui (são pulados sem
      # YVENIST_API_URL); eles têm um job próprio.
      - name: Testes
        run: flutter test

      # Links, cabeçalhos, documentos fora do índice, caminhos citados que não
      # existem mais e segredos escritos por engano em docs/.
      - name: Knowledge Base
        run: python3 tools/check_docs.py

  backend:
    name: Backend (Python + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yvenist
          POSTGRES_PASSWORD: yvenist
          POSTGRES_DB: yvenist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yvenist -d yvenist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Tipos
        run: mypy app tests

      - name: Testes (SQLite em memória)
        run: pytest -q

      # A mesma suíte no banco de produção, mais o que só existe nele: os
      # testes de requisições simultâneas e as migrações rodando de verdade.
      - name: Testes (PostgreSQL)
        env:
          YVENIST_TEST_DATABASE_URL: postgresql+psycopg://yvenist:yvenist@localhost:5432/yvenist_test
        run: pytest -q

  integration:
    name: Integração (app + API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yvenist
          POSTGRES_PASSWORD: yvenist
          POSTGRES_DB: yvenist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yvenist -d yvenist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      YVENIST_DATABASE_URL: postgresql+psycopg://yvenist:yvenist@localhost:5432/yvenist
      # Os testes criam dezenas de contas em sequência.
      YVENIST_RATE_LIMIT_ENABLED: "false"
      YVENIST_PASSWORD_HASH_PROFILE: test
      # Conta de administrador criada só para este job (banco descartável).
      YVENIST_ADMIN_EMAIL: admin@example.com
      YVENIST_ADMIN_PASSWORD: senha-do-admin-de-ci
      # Os testes no navegador saem de uma porta sorteada a cada execução.
      # Qualquer origem só é aceita aqui porque o banco é descartável; em
      # produção a API se recusa a subir assim.
      YVENIST_CORS_ORIGINS: "*"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências da API
        run: pip install -r backend/requirements.txt

      - name: Banco de dados (migrações, anúncios de exemplo e administrador)
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli seed-demo
          python -m app.cli create-admin --email "$YVENIST_ADMIN_EMAIL"

      - name: Sobe a API
        working-directory: backend
        run: |
          nohup uvicorn app.main:get_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8000/health/ready

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependências do app
        run: flutter pub get

      - name: Testes de integração
        env:
          YVENIST_API_URL: http://127.0.0.1:8000/api/v1
        run: flutter test --tags integration test/integration

      # Os mesmos cenários dentro do Chrome: é o que mostra que o app web
      # conversa com a API (CORS e o cliente HTTP do navegador).
      - name: Testes de integração no navegador
        run: >
          flutter test --platform chrome --tags integration test/integration
          --dart-define=YVENIST_API_URL=http://127.0.0.1:8000/api/v1
          --dart-define=YVENIST_ADMIN_EMAIL=$YVENIST_ADMIN_EMAIL
          --dart-define=YVENIST_ADMIN_PASSWORD=$YVENIST_ADMIN_PASSWORD

      - name: Log da API (só se algo falhou)
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"

  android:
    name: Android (APK de debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Compila o APK
        run: flutter build apk --debug

  docker:
    name: Docker (imagem + compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Sobe PostgreSQL, migrações e API
        run: docker compose up --detach --build

      - name: Espera a API responder
        run: |
          curl --silent --show-error --fail --retry 40 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/health/ready

      - name: O processo não roda como root
        run: test "$(docker compose exec -T api id -u)" = "10001"

      - name: O catálogo responde a partir do banco migrado
        run: |
          docker compose exec -T api python -m app.cli seed-demo
          curl --silent --show-error --fail \
            "http://127.0.0.1:8000/api/v1/catalog/listings?limit=1" | grep -q '"items"'

      # A receita de produção (deploy/): a mesma imagem com
      # YVENIST_ENV=production, atrás do proxy que termina o HTTPS. Com o
      # domínio "localhost" o proxy usa um certificado de teste, e por isso o
      # curl não confere quem o emitiu (--insecure). Os segredos são gerados
      # aqui e somem com o executor.
      - name: Receita de produção sobe com HTTPS
        run: |
          cat > deploy/.env <<EOF
          YVENIST_API_DOMAIN=localhost
          YVENIST_HTTP_PORT=8080
          YVENIST_HTTPS_PORT=8443
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          YVENIST_JWT_SECRET=$(openssl rand -hex 32)
          EOF
          docker compose -f deploy/docker-compose.yml up --detach --build
          curl --silent --show-error --fail --insecure --retry 40 --retry-delay 2 --retry-all-errors \
            https://localhost:8443/health/ready

      - name: Em produção, só HTTPS e com as travas ligadas
        run: |
          api=https://localhost:8443
          status() { curl --silent --insecure --output /dev/null --write-out '%{http_code}' "$@"; }

          # http é redirecionado para https.
          test "$(status http://localhost:8080/health/live)" = "308"
          # O navegador é avisado para nunca mais tentar http.
          curl --silent --insecure --dump-header - --output /dev/null "$api/health/live" \
            | grep --quiet --ignore-case '^strict-transport-security: max-age=31536000'
          # A documentação interativa fica desligada.
          test "$(status "$api/docs")" = "404"
          # O catálogo responde a partir do banco migrado.
          curl --silent --show-error --fail --insecure "$api/api/v1/catalog/categories" \
            | grep --quiet '"slug"'
          # Dados de demonstração são recusados.
          if docker compose -f deploy/docker-compose.yml exec -T api python -m app.cli seed-demo; then
            echo "seed-demo rodou em produção"
            exit 1
          fi

      # O limite de tentativas usa o IP que o proxy informa. Inventar um
      # X-Forwarded-For diferente a cada tentativa não pode zerar a contagem:
      # o proxy descarta o cabeçalho que vem do cliente.
      - name: Em produção, o limite de login vale atrás do proxy
        run: |
          attempt() {
            curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --header "X-Forwarded-For: 203.0.113.$1" \
              --data '{"email":"ninguem@example.com","password":"senha-que-nao-existe"}' \
              https://localhost:8443/api/v1/auth/login
          }
          for n in $(seq 1 10); do
            test "$(attempt "$n")" = "401"
          done
          test "$(attempt 11)" = "429"

      - name: Logs (só se algo falhou)
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f deploy/docker-compose.yml logs --no-color || true

      - name: Derruba tudo
        if: always()
        run: |
          docker compose down --volumes
          docker compose -f deploy/docker-compose.yml down --volumes || true
