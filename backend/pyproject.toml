[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yvenist-backend"
version = "0.1.0"
description = "API do Yvenist, o marketplace de eventos e festas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15,<3",
    "pwdlib[argon2]>=0.3.1,<1",
    "psycopg[binary]>=3.3,<4",
    "email-validator>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    # Cliente HTTP usado pelo TestClient (o Starlette 1.x pede httpx2).
    "httpx2>=2.13,<3",
    "ruff>=0.16,<1",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "C4",      # comprehensions
    "S",       # bandit (segurança)
    "DTZ",     # datetimes sem fuso
    "T20",     # print esquecido
    "RUF",
]
ignore = [
    "B008",    # Depends()/Query() como default é o idioma do FastAPI
    "RUF001",  # textos em português usam caracteres "ambíguos" legítimos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert e senhas de teste
"migrations/**" = ["S608"]
"app/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^\\.venv/"]

# O código da aplicação é verificado em modo estrito. Nos testes o corpo das
# funções também é verificado, mas sem exigir anotação em cada fixture e helper.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = true
