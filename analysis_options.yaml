# Regras do analisador (rodam em `flutter analyze` e no editor).
# Base: o conjunto recomendado para apps Flutter, mais as regras abaixo.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Nada de conversões implícitas a partir de `dynamic`: o JSON da API é
    # convertido de forma explícita nos mapeadores, onde um erro fica visível.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Imports sempre como `package:yvenist/...`: mover um arquivo não quebra
    # caminhos relativos do tipo `../../../../core/...`.
    - always_use_package_imports
    - directives_ordering

    # Futures esquecidos escondem erros; quem não quer esperar diz isso com
    # `unawaited(...)`.
    - unawaited_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks

    - always_declare_return_types
    - avoid_dynamic_calls
    - only_throw_errors
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
